name: Build OU Escape Route APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project archive
        run: |
          ls -la
          if [ -f "OU-Escape-Route-GitHub-Actions-ready.zip" ]; then
            unzip -o "OU-Escape-Route-GitHub-Actions-ready.zip" -d .
            echo "Archive extracted"
          else
            echo "Archive not found in repo root"
            exit 1
          fi

      - name: Find Android project root
        run: |
          echo "Project files:"
          find . -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) | head -50
          PROJECT_DIR="$(find . -name gradlew | head -n 1 | xargs dirname)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project root: $PROJECT_DIR"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          adb version
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            cd "$PROJECT_DIR"
            gradle wrapper --gradle-version 8.1.1
          fi

      - name: Make Gradle wrapper executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Clean project
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon

      - name: Build OU Escape Route APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Show generated APK
        run: |
          cd "$PROJECT_DIR"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-Escape-Route-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
