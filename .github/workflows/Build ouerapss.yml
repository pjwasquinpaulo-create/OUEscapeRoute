name: Build OU Escape Route APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="OU-Escape-Route-GitHub-Actions-ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | sort | head -200

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts file found."
            echo "The ZIP does not contain a complete Gradle Android project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper not found. Creating it."
            gradle wrapper --gradle-version 8.1.1
          fi

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          set -e
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Gradle files:"
          find . -maxdepth 3 -type f | sort

          echo "Gradle version:"
          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"
          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT="$(find "$PROJECT_DIR" -type f -name "*.apk" | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-Escape-Route-debug-apk
          path: "${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
