name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP project file found."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/project" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Could not find Android project directory."
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set Android SDK location
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/34.0.0:$PATH" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Patch Material dependency
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f app/build.gradle.kts ]; then
            FILE="app/build.gradle.kts"
          elif [ -f app/build.gradle ]; then
            FILE="app/build.gradle"
          else
            echo "ERROR: Could not find app/build.gradle or app/build.gradle.kts"
            exit 1
          fi

          if grep -q "com.google.android.material:material" "$FILE"; then
            echo "Material dependency already exists."
          elif [ "$FILE" = "app/build.gradle.kts" ]; then
            sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation("com.google.android.material:material:1.12.0")' "$FILE"
          else
            sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation "com.google.android.material:material:1.12.0"' "$FILE"
          fi

          grep -n "com.google.android.material" "$FILE"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
