name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch Material dependency
        shell: bash
        run: |
          set -e

          if [ -f app/build.gradle.kts ]; then
            FILE="app/build.gradle.kts"
          elif [ -f app/build.gradle ]; then
            FILE="app/build.gradle"
          else
            echo "ERROR: Could not find app/build.gradle.kts or app/build.gradle"
            find . -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | sort
            exit 1
          fi

          if grep -q 'com.google.android.material:material' "$FILE"; then
            echo "Material dependency already exists."
          else
            if [ "$FILE" = "app/build.gradle.kts" ]; then
              sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation("com.google.android.material:material:1.12.0")' "$FILE"
            else
              sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation "com.google.android.material:material:1.12.0"' "$FILE"
            fi
          fi

          echo "Patched dependency:"
          grep -n "com.google.android.material" "$FILE"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission to Gradle wrapper
        if: hashFiles('**/gradlew') != ''
        shell: bash
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
