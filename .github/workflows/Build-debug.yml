name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build OU Escape Route v1.0.0
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP was not found."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Using project archive: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Check Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android toolchain..."

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="${ANDROID_HOME:-$HOME/.android/sdk}"
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK build-tools 34.0.0 installed."
          echo "Android SDK Platform 34 installed."

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.7"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_DIR="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O "$GRADLE_ZIP"
            unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          fi

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

          echo "Gradle version:"
          "$GRADLE_DIR/bin/gradle" --version

      - name: Add Material dependency
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "app/build.gradle.kts" ]; then
            GRADLE_FILE="app/build.gradle.kts"
          elif [ -f "app/build.gradle" ]; then
            GRADLE_FILE="app/build.gradle"
          else
            echo "ERROR: app/build.gradle or app/build.gradle.kts was not found."
            find . -maxdepth 5 -type f -name "build.gradle*" -print
            exit 1
          fi

          echo "Using Gradle file: $GRADLE_FILE"

          if grep -q "com.google.android.material:material" "$GRADLE_FILE"; then
            echo "Material dependency already exists."
          elif [[ "$GRADLE_FILE" == *.kts ]]; then
            sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation("com.google.android.material:material:1.12.0")' "$GRADLE_FILE"
            echo "Material dependency added."
          else
            sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation "com.google.android.material:material:1.12.0"' "$GRADLE_FILE"
            echo "Material dependency added."
          fi

          grep -n "com.google.android.material" "$GRADLE_FILE"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/debug.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "DEBUG_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-debug-aligned.apk"
          FINAL_APK="$RUNNER_TEMP/app-debug-signed.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: app-debug.apk was not created."
            find "$PROJECT_DIR/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi

          zipalign -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          apksigner sign \
            --ks "$DEBUG_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          cp "$FINAL_APK" "$UNSIGNED_APK"

          echo "APK signed successfully."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          apksigner verify --verbose "$APK"

          echo "APK signature verified successfully."
          ls -lh "$APK"

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "Artifact ready: app-debug.apk"
          echo "APK size:"
          du -h "$APK"
          echo "========================================"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
